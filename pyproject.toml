[project]
name = "uk-legal-faker"
version = "0.1.0"
description = "Synthetic personal data for Ukrainian court decisions: names declined by case, real-street addresses, identifiers, military and civil bodies, and pseudonymized decisions filled with them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/uk_legal_faker/data/LICENSES.md"]
requires-python = ">=3.10"
authors = [{ name = "David Melashych" }]
keywords = ["faker", "synthetic data", "ukrainian", "court decisions", "ner", "pseudonymization", "anonymization", "legal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Ukrainian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk>=2.4",
]

[project.optional-dependencies]
faker = ["faker>=20"]

[project.scripts]
uk-legal-faker = "uk_legal_faker.cli:main"

[project.urls]
Homepage = "https://github.com/davidmelash/uk_legal_faker"
Issues = "https://github.com/davidmelash/uk_legal_faker/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "faker>=20"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_legal_faker"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]
